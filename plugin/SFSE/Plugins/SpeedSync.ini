[Settings]
; Virtual Key Code for the SpeedSync toggle.
; Default is 78 (the 'N' key).
; Refer to standard Microsoft Virtual Key Codes.
; https://learn.microsoft.com/en-us/dotnet/api/system.windows.forms.keys?view=netframework-4.8.1
Hotkey=78

; Enable dynamic speed boosting (catch-up mechanic) when far from target NPC.
; 0 = Disabled (default), 1 = Enabled.
EnableCatchUp=0

; Toggle whether sprinting breaks the speed synchronization.
; 0 = Sprinting is allowed (does not break sync), 1 = Sprinting breaks sync (default).
SprintBreaksSync=1